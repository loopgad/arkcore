[package]
name = "arkcore"
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
authors = ["ArkCore Team"]
description = "Local-First OS Agent Engine"
license = "MIT OR Apache-2.0"

[dependencies]
# ========== Web 框架 ==========
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "fs", "io-util", "net", "signal", "process"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# ========== CLI/REPL ==========
clap = { version = "4.6", features = ["derive", "wrap_help"] }
rustyline = "18"
clap_complete = "4.6"

# ========== 数据库 ==========
# 注意: 明确禁用 mysql feature 以避免 RUSTSEC-2023-0071 (RSA Marvin Attack) 漏洞
# 该漏洞影响 sqlx-mysql -> rsa 依赖链
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "derive"] }

# ========== 异步流 ==========
futures-util = "0.3"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream-util = "0.2"
tokio-tungstenite = "0.29"
futures-channel = "0.3"

# ========== HTTP 客户端 ==========
reqwest = { version = "0.12", features = ["json", "stream"] }

# ========== 随机数 ==========
getrandom = "0.2"

# ========== 安全修复 ==========
# 修复 RUSTSEC-2024-0421: idna 0.5.0 Punycode解码问题
idna = "1.0"

# ========== 工具 ==========
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "1.1"
dirs = "6"
hostname = "0.4"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
console = "0.16"
indicatif = "0.18"

# ========== 时间处理 ==========
chrono = { version = "0.4", features = ["serde"] }

# ========== 安全相关 ==========
validator = { version = "0.19", features = ["derive"] }
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
zeroize = { version = "1.8", features = ["derive"] }
pbkdf2 = "0.12"
hmac = "0.12"
parking_lot = "0.12"

# ========== 性能优化 ==========
moka = { version = "0.12", features = ["sync"] }
bbqueue = "0.4"
ahash = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
mockall = "0.13"
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"

[features]
default = []

[[bench]]
name = "benchmark"
harness = false
