name: Security

on:
  schedule:
    - cron: "0 0 * * 1" # 每周一凌晨
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  security:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: audit-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            audit-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: audit-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            audit-cargo-index-

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        run: cargo audit -D warnings
